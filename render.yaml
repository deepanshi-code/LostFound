# Render Blueprint for the API (https://render.com/docs/blueprint-spec)
# Free plan: the service sleeps after ~15 min idle and its disk is wiped on restart,
# so SEED_DEMO reloads the demo data whenever the database starts empty.
services:
  - type: web
    name: lostfound-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        value: geu.ac.in
      - key: SEED_DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      # Email: fill these in the Render dashboard (never commit them)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
