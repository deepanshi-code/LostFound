# Render Blueprint for the API (https://render.com/docs/blueprint-spec)
# Free plan: the service sleeps after ~15 min idle and its disk is wiped on restart.
# Set DATABASE_URL and SUPABASE_* (in the dashboard) so data and photos live in Supabase and survive.
# SEED_DEMO loads demo data only when the database is empty (i.e. once, on a new database).
services:
  - type: web
    name: lostfound-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        value: geu.ac.in
      - key: SEED_DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      # Permanent storage: fill these in the Render dashboard (never commit them)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: item-photos
      # Email: Render free blocks SMTP ports, so use Brevo (HTTPS). Fill these in the dashboard, never commit them.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  # The web app, built from mobile/ as a static site (free static sites don't sleep)
  - type: web
    name: lostfound-app
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the app at build time; change it and redeploy if the API address changes
      - key: EXPO_PUBLIC_API_URL
        value: https://lostfound-api-cvj8.onrender.com
    routes:
      # Single-page app: send every path to index.html
      - type: rewrite
        source: /*
        destination: /index.html
